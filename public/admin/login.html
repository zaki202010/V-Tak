<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Admin — V-TAK</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/css/app.css">
<script src="/assets/js/theme.js"></script>
</head>
<body>
<main class="container">
  <form class="card" id="f" style="max-width:420px;margin:12vh auto 0">
    <a class="logo-link" href="/admin/login.html"><img class="logo-img" src="/assets/images/logo.png" alt="V-TAK Admin" style="height:44px" onerror="this.replaceWith(document.createTextNode('V-TAK Admin'))"></a>
    <h1 style="font-size:1.4rem;margin-top:10px">Masuk Admin</h1>
    <label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="username">
    <label for="password">Kata sandi</label><input id="password" name="password" type="password" required autocomplete="current-password">
    <div id="err"></div>
    <button class="btn block mt" type="submit">Masuk</button>
  </form>
</main>
<script src="/assets/js/api.js"></script>
<script>
  VT.area = 'admin';
  VT.api('/me').then((u) => { if (u && u.role === 'admin') location.href = '/admin/index.html'; }).catch(() => {});
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target, btn = f.querySelector('button'); btn.disabled = true;
    try {
      await VT.api('/login', { method: 'POST', body: { email: f.email.value, password: f.password.value } });
      location.href = '/admin/index.html';
    } catch (err) {
      document.getElementById('err').innerHTML = '<div class="alert bad"></div>';
      document.querySelector('#err .alert').textContent = err.message;
      btn.disabled = false;
    }
  };
</script>
</body>
</html>
